# Ontwikkelen: `docker compose up -d` start alleen de database.
# Testen of draaien: `docker compose --profile app up -d --build` start ook het programma op
# http://localhost:8000 (geheimen uit backend/.env; zie TESTEN.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: portefeuille
      POSTGRES_PASSWORD: portefeuille
      POSTGRES_DB: portefeuille
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portefeuille -d portefeuille"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    image: portefeuille
    env_file: backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://portefeuille:portefeuille@db:5432/portefeuille
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dbdata:
