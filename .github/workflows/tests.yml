name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portefeuille
          POSTGRES_PASSWORD: portefeuille
          POSTGRES_DB: portefeuille_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portefeuille -d portefeuille_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Codestijl
        run: uv run ruff check . && uv run ruff format --check .
      - name: Tests met SQLite
        run: uv run pytest -q
      - name: Tests met PostgreSQL
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://portefeuille:portefeuille@localhost:5432/portefeuille_test
      - name: Migraties op een lege database, terug en weer vooruit
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run python -m app.cli logboek-controleren
        env:
          DATABASE_URL: postgresql+psycopg://portefeuille:portefeuille@localhost:5432/portefeuille_test
          # Alleen testwaarden; geen echte geheimen.
          JWT_GEHEIM: ci-geheim-alleen-voor-de-tests-0123456789abcdef
          VERSLEUTELSLEUTEL: Y2ktc2xldXRlbC1jaS1zbGV1dGVsLWNpLXNsZXV0ZWw=

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  browsertests:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
        working-directory: backend
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
      - name: Resultaten bewaren bij een fout
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browsertests
          path: frontend/test-results
          retention-days: 7
